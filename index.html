<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#0b3d2e" />
<title>Order - Kerala Kitchen</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ======== Restaurant POS - single-file form UI ========
   Mobile & tablet first. All styling inline; no external files. */
:root{
  /* Kathakali palette: pacha green, kireedam gold, crimson, black, chutti white */
  --brand:#b3202e; --brand-dk:#8f1824; --ink:#0b3d2e; --soft:#4f6a5e;
  --line:#e3e8e1; --bg:#f3f1e8; --green:#1f8a4c; --amber:#d99a1e; --gold:#e0b23c;
  --red:#b3202e; --blue:#1f6f8b; --radius:12px;
  --surface:#fff; --surface2:#f2f4f2; --text:#11190f; --grey-btn:#eceef0;
  --r-lg:22px; --r-md:16px; --r-sm:12px; --sep:rgba(60,60,67,.12);
  --shadow-1:0 1px 2px rgba(16,24,20,.06),0 4px 14px rgba(16,24,20,.05);
  --shadow-2:0 2px 6px rgba(16,24,20,.08),0 18px 40px rgba(16,24,20,.10);
  --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.01em}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
.wrap{max-width:760px;margin:0 auto;padding:14px}

/* top bar */
.topbar{background:var(--ink);color:#fff;border-bottom:3px solid var(--gold);padding:12px 14px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:20}
.topbar .t-name{font-weight:700;font-size:17px}
.topbar .spacer{flex:1}
.topbar .who{font-size:12px;color:#cdd8e3;text-align:right}
.topbar .who b{color:#fff;display:block}
.chip{display:inline-block;background:var(--gold);color:var(--ink)!important;color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.logout{background:none;border:1px solid #33506b;color:#cdd8e3;border-radius:8px;padding:6px 10px;font-size:13px}

/* action picker */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:14px 0}
.picker label{font-size:13px;color:var(--soft);font-weight:700;display:block;margin-bottom:6px}

/* cards / forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(16,24,32,.07)}
.field{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--soft);font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  font-size:16px;background:var(--surface);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(37,99,235,.35);border-color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:130px}
.inline-check{display:flex;align-items:center;gap:8px;font-weight:400}
.inline-check input{width:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);
  color:#fff;border:none;padding:14px 16px;border-radius:10px;font-size:16px;font-weight:700;
  cursor:pointer;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.btn.sm{padding:9px 12px;min-height:38px;font-size:14px}
.btn.green{background:var(--green)} .btn.blue{background:var(--blue)}
.btn.amber{background:var(--amber)} .btn.red{background:var(--red)}
.btn.grey{background:var(--grey-btn);color:var(--text)}

/* order item rows */
.cat-title{font-size:14px;color:var(--brand-dk);font-weight:700;border-bottom:2px solid var(--line);
  padding-bottom:6px;margin:16px 0 8px}
.item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.item-row .nm{flex:1}
.item-row .nm small{display:block;color:var(--soft)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;font-size:22px}
.stepper .q{min-width:34px;text-align:center;font-weight:700;font-size:18px}
.sticky-total{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:12px;
  margin:0 -16px -16px;border-radius:0 0 var(--radius) var(--radius)}
.sticky-total .t{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:10px}

/* lists / tables */
.list-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.list-item .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--soft)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.NEW{background:#e7eefc;color:#2850b5}
.badge.PREPARING{background:#fdf0d5;color:#95660a}
.badge.READY{background:#def4e6;color:#14753f}
.badge.SERVED{background:#e9e4ff;color:#5b33cc}
.badge.BILLED{background:#e8edf2;color:#4a5a69}
.badge.yes{background:#def4e6;color:#14753f}.badge.no{background:#fbe0e0;color:#a32b2b}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:var(--surface2);font-size:12px;text-transform:uppercase;color:var(--soft)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.right{text-align:right}.center{text-align:center}.mt{margin-top:12px}.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* login */
.login{position:fixed;inset:0;background:linear-gradient(160deg,#0b3d2e,#062419);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.login .box{background:var(--surface);color:var(--text);border-radius:16px;padding:24px;width:100%;max-width:360px}
.login .users{display:grid;gap:8px;margin-top:10px}
.login .users button{display:flex;justify-content:space-between;align-items:center;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:15px}

/* toast + loading */
.toasts{position:fixed;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{background:#1b2733;color:#fff;padding:12px 16px;border-radius:10px;max-width:92%;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.info{background:var(--blue)}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--brand);transform:scaleX(0);
  transform-origin:left;transition:transform .2s;z-index:200}
.loading.on{transform:scaleX(.75)}

/* bill */
.bill{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;max-width:340px;margin:0 auto;color:#000;background:#fff;padding:12px}
.bill table{width:100%;font-size:13px}.bill td{padding:2px 0}
.bill hr{border:none;border-top:1px dashed #000;margin:8px 0}.bill .tot td{font-weight:700}

@media (min-width:600px){ .item-row .stepper button{width:44px;height:44px} }
@media print{ body *{visibility:hidden} #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%} .noprint{display:none!important} }
.seatwrap{display:flex;flex-wrap:wrap;gap:8px}
.seat-chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 15px;font-weight:700;min-width:52px;text-align:center;cursor:pointer;font-size:16px}
.seat-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------- dark mode ---------- */
[data-theme="dark"]{ --bg:#0d1512; --surface:#16211c; --surface2:#1e2b25; --text:#ece7da; --line:#2a3a32; --soft:#a9b8ae; --grey-btn:#2a3a32; --ink:#ece7da; }
[data-theme="dark"] .sticky-total .t,[data-theme="dark"] details.cust summary,[data-theme="dark"] label,[data-theme="dark"] .item-row .nm{color:var(--text)}
[data-theme="dark"] .chip{color:#08130f!important}
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .topbar{background:#08130f}
[data-theme="dark"] .tab{background:var(--surface);color:var(--text)} [data-theme="dark"] .tab.on{background:var(--gold);color:#08130f;border-color:var(--gold)}
[data-theme="dark"] .cat-head{background:var(--surface2);color:var(--text)}
[data-theme="dark"] .btn.ghost{background:transparent}
[data-theme="dark"] .toast{background:#ece7da;color:#0b3d2e}
[data-theme="dark"] .badge.NEW{background:#1d2b4a;color:#9db6ff} [data-theme="dark"] .badge.PREPARING{background:#3d2f10;color:#f2c56b}
[data-theme="dark"] .badge.READY{background:#12331f;color:#7fd9a0} [data-theme="dark"] .badge.SERVED{background:#2a2350;color:#c2b3ff}
[data-theme="dark"] .badge.BILLED{background:#242c33;color:#b8c4cf} [data-theme="dark"] .badge.yes{background:#12331f;color:#7fd9a0}
[data-theme="dark"] .badge.no,[data-theme="dark"] .badge.OUT,[data-theme="dark"] .badge.CANCELLED,[data-theme="dark"] .outnote{background:#3d1a1e;color:#ff9aa3}
[data-theme="dark"] tr.clickable:active{background:var(--surface2)}
[data-theme="dark"] details.cust,[data-theme="dark"] .list-item.k-NEW{background:var(--surface)}
[data-theme="dark"] .bill,[data-theme="dark"] .bill h3,[data-theme="dark"] .bill *{color:#000} [data-theme="dark"] .bill{background:#fff} /* receipts always print light */
[data-theme="dark"] .modal-card,[data-theme="dark"] #modalMount .card{background:var(--surface)}
[data-theme="dark"] h1,[data-theme="dark"] h2,[data-theme="dark"] h3{color:var(--text)}
[data-theme="dark"] select option{color:#000}
.theme-btn{background:none;border:1px solid #33506b;color:#cdd8e3;border-radius:8px;padding:6px 9px;font-size:15px;margin-right:6px;line-height:1}
.login .theme-btn{position:fixed;top:14px;right:14px}

/* ---------- premium refinement: iOS-style surfaces, motion and controls ---------- */
*{-webkit-tap-highlight-color:transparent}
body{letter-spacing:-.012em}
h1{letter-spacing:-.03em;font-weight:800}
h2{letter-spacing:-.025em;font-weight:750}
.card{border-radius:var(--r-lg);border:1px solid var(--sep);box-shadow:var(--shadow-1);padding:18px;transition:box-shadow .35s var(--spring)}
.topbar{background:rgba(11,61,46,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:40;border-bottom:1px solid rgba(224,178,60,.55)}
.picker{background:transparent;border:0;padding:0}
.tabs{gap:4px;background:var(--grey-btn);padding:4px;border-radius:14px;display:inline-flex;max-width:100%}
.picker{padding:10px 0 2px}
.screenline{margin:2px 0 10px 4px;opacity:.75}
.tab{border:0;background:transparent;border-radius:11px;padding:9px 16px;font-weight:600;font-size:15px;color:var(--soft);transition:background .3s var(--spring),color .2s,transform .2s var(--spring)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,20,.16);border:0}
.tab:active{transform:scale(.96)}
.btn{border-radius:14px;font-weight:650;letter-spacing:-.01em;box-shadow:0 1px 2px rgba(16,24,20,.10);transition:transform .18s var(--spring),filter .2s,box-shadow .2s}
.btn:active{transform:scale(.97);filter:brightness(.96)}
.btn.sm{border-radius:11px}
.btn.grey{box-shadow:none}
input,select,textarea{border-radius:var(--r-sm);border:1px solid var(--sep);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px rgba(31,138,76,.14)}
.list-item{border-radius:var(--r-md);border:1px solid var(--sep);box-shadow:var(--shadow-1);transition:transform .25s var(--spring),box-shadow .25s}
.list-item:active{transform:scale(.995)}
.cat-head{border-radius:14px;border:1px solid var(--sep);box-shadow:none;transition:background .25s var(--spring)}
.item-row{border-bottom:1px solid var(--sep)}
.stepper button{border-radius:11px;transition:transform .15s var(--spring),background .2s}
.stepper button:active{transform:scale(.9)}
.seat-chip{border-radius:14px;transition:transform .18s var(--spring),background .25s,color .25s}
.seat-chip:active{transform:scale(.92)}
.chip{border-radius:999px;font-weight:700;letter-spacing:.02em}
.badge{border-radius:999px;font-weight:650;letter-spacing:.01em}
.search input{border-radius:14px}
.sticky-total{border-top:1px solid var(--sep);background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-radius:0 0 var(--r-lg) var(--r-lg)}
[data-theme="dark"] .sticky-total{background:rgba(22,33,28,.88)}
[data-theme="dark"] .topbar{background:rgba(8,19,15,.86)}
[data-theme="dark"] .card,[data-theme="dark"] .list-item{border-color:rgba(255,255,255,.08);box-shadow:0 1px 2px rgba(0,0,0,.4)}
[data-theme="dark"] .tab.on{background:#2b3a33;color:#fff}
[data-theme="dark"] input:focus,[data-theme="dark"] select:focus{box-shadow:0 0 0 4px rgba(224,178,60,.18)}
/* modal as a sheet */
#modalMount > div{animation:fadeIn .22s ease}
#modalMount .card{animation:sheetUp .42s var(--spring);border-radius:24px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(18px) scale(.98);opacity:0}to{transform:none;opacity:1}}
/* screen change + list entrance */
#screenBody{animation:screenIn .34s var(--spring)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{border-radius:16px;box-shadow:var(--shadow-2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:toastIn .4s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.login .box{border-radius:26px;box-shadow:var(--shadow-2);animation:sheetUp .5s var(--spring)}
.login .users button{border-radius:14px;border:1px solid var(--sep);transition:transform .18s var(--spring),box-shadow .2s}
.login .users button:active{transform:scale(.98)}
.theme-btn{border-radius:11px;transition:transform .18s var(--spring)}
.theme-btn:active{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* role-app additions */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.seat-chip:focus-visible{outline:3px solid rgba(37,99,235,.5);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;background:#7a8a9a;display:inline-block;margin-right:8px}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.k-items{margin:8px 0}
.list-item.k-NEW{border-left:6px solid #2850b5} .list-item.k-PREPARING{border-left:6px solid var(--amber)}
.list-item.ready{border-left:6px solid var(--green)}
.login .box{border-top:6px solid var(--gold)}
.login .users button.btn{justify-content:center;text-align:center;color:#fff;border:0;font-weight:800;background:var(--brand)}.login .users button.btn.blue{background:var(--blue)}
.login .brand{display:flex;align-items:center;gap:14px;margin-bottom:10px}.login .brand img{width:72px;height:72px;border-radius:16px}
.login .brand h1{margin:0}.topbar .t-logo{width:30px;height:30px;border-radius:7px;margin-right:8px}
.bill .blogo{width:84px;height:84px;display:block;margin:0 auto 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact} .list-item.partial{border-left:6px solid var(--amber)}
.k-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:18px}
.k-row .nm small{display:block;font-size:12px}
.k-row.k-READY{opacity:.55}

.cat-tools{display:flex;gap:8px;justify-content:flex-end;margin:6px 0}
.cat-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#eef3ea;border-left:5px solid var(--gold)!important;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer}
.cat-head .chev{display:inline-block;transition:transform .15s;font-size:18px}.cat-head.open .chev{transform:rotate(90deg)}
.cat-head .cat-name{flex:1}.cat-head .muted{font-weight:500;font-size:13px}
.cat-body{padding:0 4px}
.list-item.pending{border-left:6px solid var(--gold);background:linear-gradient(90deg,rgba(224,178,60,.10),transparent 40%)}
.qrsheet{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:10px}
.qrcard{border:2px solid #0b3d2e;border-radius:16px;padding:16px;text-align:center;page-break-inside:avoid;background:#fff;color:#000}
.qrcard svg{width:70%;height:auto}.qrcard .qt{font-size:28px;font-weight:800;margin-top:6px}.qrcard .qn{font-size:16px;color:#0b3d2e;font-weight:700}.qrcard .qs{font-size:13px;color:#444}.qrcard .qs2{font-size:11px;color:#888;margin-top:2px}
@media print{.qrsheet{gap:12px}}
.screenline-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-6px 0 8px 4px}
.screenline-row .screenline{margin:0}
.fontctl{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.fontctl button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:5px 11px;font-weight:800;font-size:14px;cursor:pointer}
.fontctl button:active{transform:scale(.94)}
.screenline{font-size:13px;margin:-6px 0 8px 4px;display:inline-flex;gap:6px}
.search{position:relative}.search input{width:100%;padding:13px 44px 13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--text)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--grey-btn);color:var(--text);font-size:20px;line-height:1;cursor:pointer}
.k-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
.k-row.k-OUT .nm{text-decoration:line-through;opacity:.6}
li.oi-OUT{text-decoration:line-through;opacity:.7}
.list-item.hasout{border-left:6px solid var(--red)}
.list-item.served{border-left:6px solid #7a8a9a;opacity:.85}
.outnote{background:#fdecec;color:#8a1f1f;border-radius:8px;padding:8px 10px;font-size:14px;margin-top:6px}
.badge.OUT,.badge.CANCELLED{background:#fdecec;color:#8a1f1f}
details.cust{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
details.cust summary{cursor:pointer;font-weight:700;font-size:15px}
details.cust[open] summary{margin-bottom:8px}
tr.clickable{cursor:pointer} tr.clickable:active{background:#f4f6f9}
.picker{padding:0 12px}
@media (prefers-reduced-motion:reduce){ .dot.bad{animation:none} }

/* ====================== Liquid Glass theme ======================
   Translucent, frosted surfaces with a light edge and specular highlight,
   over soft colour washes so the glass has something to refract.
   Turned off per tablet with html[data-glass="off"] (login screen switch). */
:root{ --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(16,24,20,.10),0 1px 2px rgba(16,24,20,.06); --glass-blur:18px; }
[data-theme="dark"]{ --glass:rgba(28,40,34,.55); --glass-strong:rgba(28,40,34,.72); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4); }

/* colour washes behind everything */
html:not([data-glass="off"]) body{position:relative;isolation:isolate}
html:not([data-glass="off"]) body::before,html:not([data-glass="off"]) body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
html:not([data-glass="off"]) body::before{width:60vw;height:60vw;max-width:620px;max-height:620px;left:-18vw;top:-14vh;background:radial-gradient(circle at 40% 40%,#9fd8b6,#e0b23c 70%,transparent 72%)}

function mlWord(w){

      out+=m[1]; i+=m[0].length; prevCons=true; continue; }
    var v=null; ['aa','ee','oo','ai','au','ou','ei','ea','ie','a','i','u','e','o'].some(function(x){ if(lw.substr(i,x.length)===x){v=x;return true;} });
    if(v){ var pair=ML_VOW[v]; if(prevCons){ if(v==='a'&&i+1===n) out+='';  /* trailing a: inherent vowel */ else out+=pair[1]; } else out+=pair[0]; i+=v.length; prevCons=false; continue; }
    out+=lw[i]; i++; prevCons=false;

function mlAuto(text){

/* ---------- location check (admin can turn it on; off by default) ---------- */
function haversine(a,b,c,d){ var R=6371000,toR=Math.PI/180,dLat=(c-a)*toR,dLng=(d-b)*toR; var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*toR)*Math.cos(c*toR)*Math.sin(dLng/2)*Math.sin(dLng/2); return 2*R*Math.asin(Math.sqrt(h)); }
function measureDistance(){
  return new Promise(function(res){
    if(!navigator.geolocation){res({ok:false,reason:'nogeo'});return;}
    var lat=Number(state.settings.GeoLat), lng=Number(state.settings.GeoLng); if(!lat&&!lng){res({ok:false,reason:'noconfig'});return;}
    navigator.geolocation.getCurrentPosition(function(pos){ var d=haversine(pos.coords.latitude,pos.coords.longitude,lat,lng); res({ok:true,distance:Math.round(d),accuracy:Math.round(pos.coords.accuracy||0)}); },
      function(e){ res({ok:false,reason:e.code===1?'denied':'unavailable'}); },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });
}
function geoGate(){
  var on=state.settings.GeoEnabled===true||state.settings.GeoEnabled==='true';
  /* always try to measure (waiters see the distance); only block when the check is switched on */
  return measureDistance().then(function(r){
    state.geo=r;
    if(!on)return true;
    var radius=Number(state.settings.GeoRadius)||150;
    if(r.ok&&r.distance<=radius+Math.min(r.accuracy||0,50))return true;
    var why=!r.ok&&r.reason==='denied'?t('Please allow location access so we can confirm you are at the restaurant, then reload this page.')
          :!r.ok?t('We could not confirm your location. Please ask a waiter to take your order.')
          :t('Ordering from this page only works inside the restaurant.');
    $('#main').innerHTML='<div class="card"><h2>'+t('Ordering is only available at')+' '+esc(state.restaurant)+'</h2><p class="muted">'+why+'</p>'
      +(r.ok?'<p class="muted">'+t('Measured distance')+': '+(r.distance>=1000?(r.distance/1000).toFixed(1)+' km':r.distance+' m')+'</p>':'')
      +'<button class="btn block mt" onclick="location.reload()">'+t('Try again')+'</button></div>';
    return false;
  });
}

function imgFallback(img){
  var m=String(img.src||'').match(/[?&]id=([-\w]{25,})|\/d\/([-\w]{25,})/); var id=m&&(m[1]||m[2]); var step=Number(img.dataset.step||0);

/* ImageFit = "ox,oy,zoom,rot" set by the admin: offset of the picture centre in % of the frame, zoom 1-3, rotation in degrees.
   Empty = fill the frame, centred. The picture is placed with a transform, so any rotation still fills the frame. */
function parseFit(f){ var p=String(f||'').split(',').map(Number); return {x:isNaN(p[0])?0:p[0],y:isNaN(p[1])?0:p[1],z:isNaN(p[2])||!p[2]?1:p[2],r:isNaN(p[3])?0:p[3]}; }
function fitImage(img,fit){
  var o=parseFit(fit!==undefined?fit:img.dataset.fit), box=img.parentElement; if(!box||!img.naturalWidth)return;
  var W=box.clientWidth,H=box.clientHeight,w=img.naturalWidth,h=img.naturalHeight; if(!W||!H)return;
  var side=(o.r%180)!==0, ew=side?h:w, eh=side?w:h, s=Math.max(W/ew,H/eh)*o.z;

  img.style.transform='translate(-50%,-50%) translate('+(o.x*W/100)+'px,'+(o.y*H/100)+'px) rotate('+o.r+'deg) scale('+s+')';

  var byCat={}; state.menu.forEach(function(m){(byCat[m.Category]=byCat[m.Category]||[]).push(m);});
  wrap.innerHTML=menuViewSwitch()+Object.keys(byCat).map(function(cat){ var open=state.openCats.hasOwnProperty(cat)?state.openCats[cat]:true; var n=byCat[cat].reduce(function(s,m){return s+(state.cart[m.MenuID]?state.cart[m.MenuID].Quantity:0);},0);
    return '<button type="button" class="cat-head'+(open?' open':'')+'" onclick="state.openCats[\''+esc(cat).replace(/'/g,"\\'")+'\']=!'+open+';renderMenu()"><span class="chev">&#9656;</span><span class="cat-name">'+esc(catName(cat))+'</span><span class="muted">'+byCat[cat].length+' '+t('items')+(n?' &middot; <b>'+n+' '+t('chosen')+'</b>':'')+'</span></button><div class="cat-body'+(open?'':' hidden')+'">'+byCat[cat].map(itemRow).join('')+'</div>'; }).join('');
}
function cartStep(id,d){ var m=state.menu.filter(function(x){return x.MenuID===id;})[0]; if(!m)return; var line=state.cart[id]||{MenuID:id,ItemName:m.ItemName,UnitPrice:m.Price,Quantity:0}; line.Quantity+=d; if(line.Quantity<=0)delete state.cart[id]; else state.cart[id]=line; var q=$('#q_'+id); if(q)q.textContent=state.cart[id]?state.cart[id].Quantity:0; updateBar(); if(menuView()==='cards'){cardsAfterStep(id);return;} if(!state.menuQuery)renderMenu(); }
function updateBar(){ var n=0,sub=0; Object.keys(state.cart).forEach(function(k){n+=state.cart[k].Quantity; sub+=state.cart[k].Quantity*state.cart[k].UnitPrice;}); $('#oCount').textContent=n?(n+' '+t(n>1?'items':'item')):t('No items yet'); $('#oSub').textContent=money(sub); var b=$('#oSend'); b.disabled=!(n&&state.seats.length)||state.sending; b.textContent=state.sending?t('Sending...'):(!state.seats.length&&n?t('Choose your chair first'):t('Send to waiter')); }
function sendRequest(){
  if(state.sending)return; var items=Object.keys(state.cart).map(function(k){var l=state.cart[k]; return {MenuID:l.MenuID,ItemName:l.ItemName,Quantity:l.Quantity,UnitPrice:l.UnitPrice,Amount:l.Quantity*l.UnitPrice};});
  if(!items.length||!state.seats.length)return;
  if(!state.orderRef)state.orderRef=newRef(); state.sending=true; updateBar(); loading(true);
  var total=items.reduce(function(s,i){return s+i.Amount;},0);
  var doc={TableID:TABLE_ID,TableName:state.table.TableName,SeatNo:state.seats.join(','),CustomerUid:uid,CustomerName:String($('#cName').value||'').trim(),CustomerPhone:String($('#cPhone').value||'').replace(/\s+/g,''),Note:String($('#cNote').value||'').trim(),
    items:items,Total:total,Status:'PENDING',CreatedAt:nowISO(),ClientRef:state.orderRef,Source:'QR',
    SittingID:state.sittingId||'',NewGuests:!!state.newGuests,Distance:(state.geo&&state.geo.ok)?state.geo.distance:null};
  var ref=db.collection('requests').doc(); doc.RequestID=ref.id;
  ref.set(doc).then(function(){ loading(false); state.sending=false; state.orderRef=null; state.cart={}; state.myReqs.push(ref.id); saveMine();
    toast('success',t('Sent! A waiter will confirm your order shortly.'),6000); renderMenu(); updateBar(); watchMine(); window.scrollTo({top:0,behavior:'smooth'}); })
  .catch(function(e){ loading(false); state.sending=false; updateBar(); toast('error','Could not send: '+e.message,8000); });
}
/* ---------- my orders (live) ---------- */
var reqSubs={}, orderSubs={}, reqData={}, orderData={};
function watchMine(){
  state.myReqs.forEach(function(id){ if(reqSubs[id])return;
    reqSubs[id]=db.collection('requests').doc(id).onSnapshot(function(s){ if(!s.exists)return; var d=s.data(); reqData[id]=d; renderMine();
      if(d.Status==='APPROVED'&&d.ApprovedAs&&!orderSubs[d.ApprovedAs]){ orderSubs[d.ApprovedAs]=db.collection('orders').doc(d.ApprovedAs).onSnapshot(function(o){ if(o.exists){orderData[d.ApprovedAs]=o.data(); renderMine();} },function(){}); } },function(){}); });
}
function renderMine(){
  var box=$('#mine'); if(!box)return; var ids=state.myReqs.slice().reverse(); if(!ids.length){box.innerHTML='';return;}
  box.innerHTML=ids.map(function(id){ var r=reqData[id]; if(!r)return '';
    var st=r.Status, o=r.ApprovedAs?orderData[r.ApprovedAs]:null;
    var label=st==='PENDING'?t('Waiting for a waiter to confirm'):st==='REJECTED'?t('Not accepted')+(r.RejectReason?': '+esc(r.RejectReason):''):st==='CANCELLED'?t('Cancelled'):o?(o.OrderStatus==='READY'?t('Ready - coming to your table'):o.OrderStatus==='SERVED'||o.OrderStatus==='BILLED'?t('Served'):o.OrderStatus==='PREPARING'?t('Being prepared in the kitchen'):t('Confirmed - sent to the kitchen')):t('Confirmed - sent to the kitchen');
    var cls=st==='REJECTED'||st==='CANCELLED'?'REJECTED':(o&&o.OrderStatus==='READY')?'READY':st;
    var items=(o?o.items:r.items).map(function(it){ var s=it.ItemStatus; var mm=(state.menu.filter(function(x){return x.MenuID===it.MenuID;})[0]); var nm=lang()!=='ml'?it.ItemName:((mm&&mm.ItemNameMl)||mlAuto(it.ItemName));
      return '<li'+(s==='OUT'?' style="text-decoration:line-through;opacity:.6"':'')+'>'+it.Quantity+'&times; '+esc(nm)+(s==='OUT'?' <span class="badge no">'+t('sold out')+'</span>':s==='READY'?' <span class="badge READY">'+t('ready')+'</span>':s==='PREPARING'?' <span class="badge PREPARING">'+t('preparing')+'</span>':'')+'</li>'; }).join('');
    var cancel=st==='PENDING'?'<button class="btn grey sm mt" onclick="cancelReq(\''+id+'\')">'+t('Cancel this order')+'</button>':'';
    return '<div class="list-item status '+cls+'"><div class="head"><b>'+label+'</b><span class="muted">'+ago(r.CreatedAt)+'</span></div><ul style="margin:6px 0;padding-left:18px">'+items+'</ul><div class="muted">'+t('Total')+' '+money(o?o.OrderTotal:r.Total)+(o?' &middot; '+esc(o.OrderID):'')+'</div>'+cancel+'</div>'; }).join('');
}
function cancelReq(id){ db.collection('requests').doc(id).update({Status:'CANCELLED'}).then(function(){toast('info','Order cancelled.');}).catch(function(e){toast('error','Too late to cancel: a waiter is already handling it.');}); }
</script>
</body>
